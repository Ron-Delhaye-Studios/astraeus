<title id="wheel-title">Astrology chart wheel frame</title>
<desc id="wheel-desc">Empty natal-chart wheel: outer gold ring with 72 degree ticks, twelve house dividers, alternating faint sign bands, inner hairline circle, and a central hub with an eight-pointed star. Transparent middle for planet placement.</desc>
