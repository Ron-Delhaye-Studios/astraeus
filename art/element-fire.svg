<circle cx="60" cy="60" r="58" fill="url(#el-fire-mbg)"/>
<circle cx="60" cy="60" r="52" fill="none" stroke="#d4af37" stroke-width="2.5"/>
<circle cx="60" cy="60" r="44" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
<text x="60" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#e0654f">火</text>
<text x="60" y="106" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" letter-spacing="3" fill="#f5f0e1">FIRE</text>
